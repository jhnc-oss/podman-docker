name: codeql

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    name: "CodeQL"
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: CodeQL Initialization
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: actions
          build-mode: none
      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.9
